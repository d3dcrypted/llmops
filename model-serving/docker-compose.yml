services:
  llama-server:
    # Pinned by tag and digest. Upstream publishes only full-<sha> and light-<sha>
    # tags, so a floating tag here is not just unreproducible, it does not resolve.
    image: ghcr.io/ggerganov/llama.cpp:full-1e5a6d088d0f3a967c6e86298a756daec9e8df12@sha256:7195b11d90b4c3258ec0c34256395dffbf4d29c296b586913afa216ef1b0e96b
    command: >
      -m /models/model.gguf
      --host 0.0.0.0
      --port 8001
      -c 4096
      --threads 6
      --parallel 2
      --metrics
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ${MODEL_PATH:-./models}:/models:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # No default credential: compose fails loudly if the operator has not set one.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana-data:
