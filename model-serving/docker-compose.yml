services:
  llama-server:
    # Pinned by build tag and digest. The server image's entrypoint is llama-server,
    # so `command` is its argument list. To move to a newer build, change both.
    image: ghcr.io/ggml-org/llama.cpp:server-b12767@sha256:b24873ae66a4732e0b4b66dd7dc658066ccad6e8c63524278e92eebc767aacbe
    command: >
      -m /models/model.gguf
      --host 0.0.0.0
      --port 8001
      -c 4096
      --threads 6
      --parallel 2
      --metrics
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ${MODEL_PATH:-./models}:/models:ro
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # No default credential: compose fails loudly if the operator has not set one.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  grafana-data:
